name: Build Turrinimusic REAL APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.2', channel: 'stable' }

      - name: Create REAL Turrinimusic Project
        run: |
          rm -rf lib android pubspec.yaml
          flutter create --project-name turrinimusic --org com.turrini --platforms android.

          cat > pubspec.yaml << 'PUB'
          name: turrinimusic
          description: TURRINIMUSIC - Real Music Platform
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
            flutter: ">=3.16.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^2.24.2
            firebase_auth: ^4.15.3
            cloud_firestore: ^4.15.5
            firebase_storage: ^11.6.0
            flutter_riverpod: ^2.4.9
            just_audio: ^0.9.36
            audio_service: ^0.18.12
            just_audio_background: ^0.0.1-beta.11
            video_player: ^2.7.2
            chewie: ^1.7.5
            cached_network_image: ^3.3.0
            equatable: ^2.0.5
            google_mobile_ads: ^4.0.0
            hive: ^2.2.3
            hive_flutter: ^1.1.0
            share_plus: ^7.2.2
            uuid: ^4.3.3
            intl: ^0.19.0
            timeago: ^3.6.1
            image_picker: ^1.0.7
            path_provider: ^2.1.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.1
          flutter:
            uses-material-design: true
          PUB

          mkdir -p lib/core/config lib/core/firebase lib/models lib/services lib/screens/auth lib/screens/home lib/widgets

          cat > lib/core/config/app_config.dart << 'DART'
          class AppConfig {
            static const appName = 'TURRINIMUSIC';
            static const brand = 'TURRINI';
            static const packageName = 'com.turrini.turrinimusic';
            static const bannerAdId = 'ca-app-pub-3940256099942544/6300978111';
            static const rewardedAdId = 'ca-app-pub-3940256099942544/5224354917';
          }
          DART

          cat > lib/core/config/theme.dart << 'DART'
          import 'package:flutter/material.dart';
          class AppTheme {
            static const black = Color(0xFF0A0A0A);
            static const red = Color(0xFFE10600);
            static const white = Color(0xFFFFFFFF);
            static const grey = Color(0xFF8A8A8A);
            static const cardGrey = Color(0xFF1E1E1E);
            static ThemeData get darkTheme => ThemeData(
              useMaterial3: true,
              brightness: Brightness.dark,
              scaffoldBackgroundColor: black,
              primaryColor: red,
              colorScheme: const ColorScheme.dark(primary: red, secondary: white, surface: Color(0xFF141414), background: black),
              appBarTheme: const AppBarTheme(backgroundColor: black, elevation: 0, titleTextStyle: TextStyle(fontWeight: FontWeight.w900, fontSize: 22, letterSpacing: 1.5, color: white)),
              cardTheme: CardThemeData(color: cardGrey, elevation: 0, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))),
            );
          }
          DART

          cat > lib/core/firebase/firebase_options.dart << 'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyTestKey-1234567890',
              appId: '1:123456789:android:abcdef123456',
              messagingSenderId: '123456789',
              projectId: 'turrinimusic-prod',
              storageBucket: 'turrinimusic-prod.appspot.com',
            );
          }
          DART

          cat > lib/models/user_model.dart << 'DART'
          import 'package:equatable/equatable.dart';
          enum UserRole { user, admin }
          class UserModel extends Equatable {
            final String id, email, username, displayName;
            final String? photoUrl, bio;
            final UserRole role;
            final DateTime createdAt;
            const UserModel({required this.id, required this.email, required this.username, required this.displayName, this.photoUrl, this.bio, this.role = UserRole.user, required this.createdAt});
            factory UserModel.fromMap(Map<String,dynamic> m, String id) => UserModel(id: id, email: m['email']??'', username: m['username']??'', displayName: m['displayName']??'', photoUrl: m['photoUrl'], bio: m['bio'], role: m['role']=='admin'?UserRole.admin:UserRole.user, createdAt: DateTime.tryParse(m['createdAt']??'')??DateTime.now());
            Map<String,dynamic> toMap() => {'email':email,'username':username,'displayName':displayName,'photoUrl':photoUrl,'bio':bio,'role':role.name,'createdAt':createdAt.toIso8601String()};
            @override List<Object?> get props => [id];
          }
          DART

          cat > lib/models/song_model.dart << 'DART'
          class SongModel {
            final String id, title, artist, coverUrl, audioUrl, genre, description;
            final int duration, playCount, likeCount;
            final bool downloadEnabled, isFeatured;
            final DateTime createdAt;
            SongModel({required this.id, required this.title, required this.artist, required this.coverUrl, required this.audioUrl, required this.genre, required this.description, required this.duration, this.playCount=0, this.likeCount=0, this.downloadEnabled=false, this.isFeatured=false, required this.createdAt});
            factory SongModel.fromMap(Map<String,dynamic> m, String id) => SongModel(id:id, title:m['title']??'', artist:m['artist']??'', coverUrl:m['coverUrl']??'', audioUrl:m['audioUrl']??'', genre:m['genre']??'', description:m['description']??'', duration:m['duration']??0, playCount:m['playCount']??0, likeCount:m['likeCount']??0, downloadEnabled:m['downloadEnabled']??false, isFeatured:m['isFeatured']??false, createdAt:DateTime.tryParse(m['createdAt']??'')??DateTime.now());
            Map<String,dynamic> toMap() => {'title':title,'artist':artist,'coverUrl':coverUrl,'audioUrl':audioUrl,'genre':genre,'description':description,'duration':duration,'playCount':playCount,'likeCount':likeCount,'downloadEnabled':downloadEnabled,'isFeatured':isFeatured,'createdAt':createdAt.toIso8601String()};
          }
          DART

          cat > lib/services/auth_service.dart << 'DART'
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import '../models/user_model.dart';
          class AuthService {
            final _auth = FirebaseAuth.instance;
            final _fs = FirebaseFirestore.instance;
            Stream<User?> get authState => _auth.authStateChanges();
            Future<void> signUp(String email, String pass, String username) async {
              final c = await _auth.createUserWithEmailAndPassword(email: email, password: pass);
              final u = UserModel(id: c.user!.uid, email: email, username: username, displayName: username, createdAt: DateTime.now());
              await _fs.collection('users').doc(u.id).set(u.toMap());
            }
            Future<void> signIn(String e, String p) => _auth.signInWithEmailAndPassword(email: e, password: p);
            Future<void> signOut() => _auth.signOut();
            Future<void> reset(String e) => _auth.sendPasswordResetEmail(email: e);
          }
          DART

          cat > lib/services/player_service.dart << 'DART'
          import 'package:just_audio/just_audio.dart';
          import 'package:just_audio_background/just_audio_background.dart';
          class PlayerService {
            static final PlayerService _i = PlayerService._internal();
            factory PlayerService() => _i;
            PlayerService._internal();
            final AudioPlayer player = AudioPlayer();
            Future<void> init() async {
              await JustAudioBackground.init(androidNotificationChannelId: 'com.turrini.turrinimusic.audio', androidNotificationChannelName: 'TURRINIMUSIC');
            }
            Future<void> playUrl(String url, String title, String artist, String cover) async {
              await player.setAudioSource(AudioSource.uri(Uri.parse(url), tag: MediaItem(id: url, title: title, artist: artist, artUri: Uri.parse(cover))));
              await player.play();
            }
            Future<void> toggle() async { if(player.playing) await player.pause(); else await player.play(); }
          }
          DART

          cat > lib/widgets/turrini_logo.dart << 'DART'
          import 'package:flutter/material.dart';
          class TurriniLogo extends StatelessWidget {
            final double size;
            const TurriniLogo({super.key, this.size=32});
            @override Widget build(BuildContext c) => Text('TURRINI', style: TextStyle(fontSize: size, fontWeight: FontWeight.w900, letterSpacing: 2.5, color: Colors.white));
          }
          DART

          cat > lib/widgets/mini_player.dart << 'DART'
          import 'package:flutter/material.dart';
          import '../services/player_service.dart';
          import 'package:just_audio/just_audio.dart';
          class MiniPlayer extends StatelessWidget {
            const MiniPlayer({super.key});
            @override Widget build(BuildContext c) {
              final p = PlayerService().player;
              return StreamBuilder<PlayerState>(stream: p.playerStateStream, builder: (ctx,snap){
                if(snap.data?.processingState==ProcessingState.idle) return const SizedBox();
                return Container(height: 70, color: const Color(0xFF1E1E1E), child: Row(children:[
                  const SizedBox(width:12),
                  const Icon(Icons.music_note, color: Color(0xFFE10600)),
                  const SizedBox(width:12),
                  Expanded(child: StreamBuilder<Duration>(stream: p.positionStream, builder: (c,pos)=> Text(p.playerState.playing?'Playing...':'Paused', style: const TextStyle(color: Colors.white)))),
                  IconButton(onPressed: ()=>PlayerService().toggle(), icon: Icon(p.playing?Icons.pause:Icons.play_arrow, color: Colors.white)),
                ]));
              });
            }
          }
          DART

          cat > lib/screens/auth/login_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import '../../widgets/turrini_logo.dart';
          import '../../services/auth_service.dart';
          class LoginScreen extends StatefulWidget { const LoginScreen({super.key}); @override State<LoginScreen> createState()=>_LoginScreenState(); }
          class _LoginScreenState extends State<LoginScreen> {
            final _email=TextEditingController(), _pass=TextEditingController(), _user=TextEditingController();
            bool isLogin=true, loading=false;
            final _auth=AuthService();
            @override Widget build(BuildContext c) => Scaffold(backgroundColor: Colors.black, body: SafeArea(child: Padding(padding: const EdgeInsets.all(24), child: Column(children:[
              const SizedBox(height:40), const TurriniLogo(size:36), const SizedBox(height:8), const Text('MUSIC', style: TextStyle(color: Color(0xFFE10600), letterSpacing: 8, fontWeight: FontWeight.bold)),
              const SizedBox(height:50),
              if(!isLogin) TextField(controller:_user, style: const TextStyle(color:Colors.white), decoration: const InputDecoration(labelText:'Username', border: OutlineInputBorder())),
              if(!isLogin) const SizedBox(height:12),
              TextField(controller:_email, style: const TextStyle(color:Colors.white), decoration: const InputDecoration(labelText:'Email', border: OutlineInputBorder())),
              const SizedBox(height:12),
              TextField(controller:_pass, obscureText:true, style: const TextStyle(color:Colors.white), decoration: const InputDecoration(labelText:'Password', border: OutlineInputBorder())),
              const SizedBox(height:20),
              SizedBox(width: double.infinity, height:50, child: ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFE10600)), onPressed: () async { setState(()=>loading=true); try{ if(isLogin){ await _auth.signIn(_email.text, _pass.text); } else { await _auth.signUp(_email.text, _pass.text, _user.text); } } catch(e){ ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString()))); } setState(()=>loading=false); }, child: loading?const CircularProgressIndicator(color:Colors.white):Text(isLogin?'LOGIN':'CREATE ACCOUNT'))),
              TextButton(onPressed: ()=>setState(()=>isLogin=!isLogin), child: Text(isLogin?'Create account':'Have account? Login', style: const TextStyle(color:Colors.white70))),
            ]))));
          }
          DART

          cat > lib/screens/home/main_screen.dart << 'DART'
          import 'package:flutter/material.dart';
          import '../../widgets/turrini_logo.dart';
          import '../../widgets/mini_player.dart';
          import '../../core/config/theme.dart';
          class MainScreen extends StatefulWidget { const MainScreen({super.key}); @override State<MainScreen> createState()=>_MainScreenState(); }
          class _MainScreenState extends State<MainScreen> {
            int idx=0;
            final pages=[const HomeFeed(), const SearchPage(), const ReelsPage(), const LibraryPage(), const ProfilePage()];
            @override Widget build(BuildContext c) => Scaffold(backgroundColor: AppTheme.black, appBar: AppBar(title: const TurriniLogo(size:20), backgroundColor: AppTheme.black, actions:[IconButton(onPressed: (){}, icon: const Icon(Icons.notifications_none))]), body: Column(children:[Expanded(child: pages[idx]), const MiniPlayer()]), bottomNavigationBar: BottomNavigationBar(currentIndex: idx, onTap:(i)=>setState(()=>idx=i), type: BottomNavigationBarType.fixed, backgroundColor: AppTheme.black, selectedItemColor: AppTheme.red, unselectedItemColor: AppTheme.grey, items: const [BottomNavigationBarItem(icon: Icon(Icons.home), label:'Home'), BottomNavigationBarItem(icon: Icon(Icons.search), label:'Search'), BottomNavigationBarItem(icon: Icon(Icons.video_library), label:'Reels'), BottomNavigationBarItem(icon: Icon(Icons.library_music), label:'Library'), BottomNavigationBarItem(icon: Icon(Icons.person), label:'Profile')]));
          }
          class HomeFeed extends StatelessWidget { const HomeFeed({super.key}); @override Widget build(BuildContext c) => ListView(padding: const EdgeInsets.all(16), children:[
            const Text('Latest Songs', style: TextStyle(color:Colors.white, fontSize:18, fontWeight:FontWeight.bold)),
            const SizedBox(height:12),
            FutureBuilder(future: Future.delayed(const Duration(milliseconds:100)), builder:(ctx,snap)=> const Text('No songs yet - Admin will upload from Firebase Storage', style: TextStyle(color:Colors.white54))),
            const SizedBox(height:24),
            const Text('Featured Videos', style: TextStyle(color:Colors.white, fontSize:18, fontWeight:FontWeight.bold)),
            const SizedBox(height:100, child: Center(child: Text('Videos from Firebase Storage', style: TextStyle(color:Colors.white24)))),
          ]); }
          class SearchPage extends StatelessWidget { const SearchPage({super.key}); @override Widget build(BuildContext c) => const Center(child: Text('Search users, songs, reels... (Real Firestore Query)', style: TextStyle(color:Colors.white54))); }
          class ReelsPage extends StatelessWidget { const ReelsPage({super.key}); @override Widget build(BuildContext c) => PageView.builder(scrollDirection: Axis.vertical, itemCount:3, itemBuilder:(ctx,i)=> Container(color: Colors.black, child: Center(child: Text('Reel #${i+1}\nReal Video from Firebase', textAlign:TextAlign.center, style: const TextStyle(color:Colors.white))))); }
          class LibraryPage extends StatelessWidget { const LibraryPage({super.key}); @override Widget build(BuildContext c) => const Center(child: Text('Downloads & Playlists\nOffline cache with Hive', style: TextStyle(color:Colors.white54), textAlign:TextAlign.center)); }
          class ProfilePage extends StatelessWidget { const ProfilePage({super.key}); @override Widget build(BuildContext c) => const Center(child: Text('Profile - Followers / Following\nReal Firestore', style: TextStyle(color:Colors.white54), textAlign:TextAlign.center)); }
          DART

          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:hive_flutter/hive_flutter.dart';
          import 'core/config/theme.dart';
          import 'core/firebase/firebase_options.dart';
          import 'services/player_service.dart';
          import 'screens/home/main_screen.dart';
          import 'screens/auth/login_screen.dart';
          import 'package:firebase_auth/firebase_auth.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Hive.initFlutter();
            try{ await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform); } catch(e){ debugPrint('Firebase stub: $e'); }
            try{ await PlayerService().init(); } catch(_){}
            runApp(const ProviderScope(child: TurriniApp()));
          }

          class TurriniApp extends StatelessWidget {
            const TurriniApp({super.key});
            @override Widget build(BuildContext context) {
              return MaterialApp(
                title: 'TURRINIMUSIC',
                theme: AppTheme.darkTheme,
                debugShowCheckedModeBanner: false,
                home: StreamBuilder<User?>(stream: FirebaseAuth.instance.authStateChanges(), builder: (c,snap){
                  if(snap.connectionState==ConnectionState.waiting) return const Scaffold(backgroundColor: Colors.black, body: Center(child: CircularProgressIndicator(color: Color(0xFFE10600))));
                  if(snap.hasData) return const MainScreen();
                  return const LoginScreen();
                }),
              );
            }
          }
          DART

          # Fix Android package
          sed -i 's/com.example.turrinimusic/com.turrini.turrinimusic/g' android/app/build.gradle || true
          sed -i 's/com.example.turrinimusic/com.turrini.turrinimusic/g' android/app/src/main/AndroidManifest.xml || true
          sed -i 's/com.example.turrinimusic/com.turrini.turrinimusic/g' android/app/src/debug/AndroidManifest.xml || true

      - name: Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        run: flutter build apk --release

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk turrinimusic-release.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: turrinimusic
