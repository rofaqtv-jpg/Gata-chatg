name: Build Turrinimusic APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Create Firebase Options (from Secrets)
        run: |
          mkdir -p lib/core/firebase
          cat > lib/core/firebase/firebase_options.dart << 'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return android;
            }
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: String.fromEnvironment('FIREBASE_API_KEY', defaultValue: 'test-key'),
              appId: String.fromEnvironment('FIREBASE_APP_ID', defaultValue: '1:123456789:android:abcdef'),
              messagingSenderId: String.fromEnvironment('FIREBASE_SENDER_ID', defaultValue: '123456789'),
              projectId: String.fromEnvironment('FIREBASE_PROJECT_ID', defaultValue: 'turrinimusic-test'),
              storageBucket: String.fromEnvironment('FIREBASE_STORAGE', defaultValue: 'turrinimusic-test.appspot.com'),
            );
          }
          EOF

      - name: Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Test
        run: flutter test || echo "No tests yet"

      - name: Build APK Release
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=BANNER_AD_ID=${{ secrets.BANNER_AD_ID }} \
            --dart-define=REWARDED_AD_ID=${{ secrets.REWARDED_AD_ID }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk turrinimusic-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: turrinimusic-release
          path: turrinimusic-release.apk
          retention-days: 30
